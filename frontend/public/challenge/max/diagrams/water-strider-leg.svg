    <path d="M170 168 Q230 150 270 188"/>
    <path d="M140 170 Q110 182 92 189"/>
    <path d="M162 170 Q192 182 210 189"/>
  </g>
  <g fill="none" stroke="#2D7FB0" stroke-width="2.5">
