  <ellipse cx="150" cy="165" rx="34" ry="12" fill="#5B4636"/>
  <circle cx="186" cy="161" r="9" fill="#5B4636"/>
  <g stroke="#5B4636" stroke-width="4" fill="none" stroke-linecap="round">
