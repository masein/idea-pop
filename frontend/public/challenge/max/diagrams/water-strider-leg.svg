      <path d="M470.0 190.7 l-5 12"/>
      <path d="M481.0 191.0 l5 12"/>
      <path d="M492.0 190.7 l-5 12"/>
      <path d="M503.0 189.9 l5 12"/>
      <path d="M514.0 188.5 l-5 12"/>
